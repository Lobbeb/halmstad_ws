  - id: "12_best_known_minimal"
    goal: "Candidate stable config if baseline is noisy."

    ## ARGS HERE ##
    run_args: ./run.sh tmux_1to1 start baylands session:=yolo_debug mode:=yolo gui:=false weights:=...v9-tuned-full.pt follow_yaw:=true pan_enable:=false use_tilt:=false range_mode:=auto visual_follow_logic:=legacy tracker:=false external_detection_node:=detector detector_backend:=ultralytics detector_async_inference:=false use_estimate:=true omnet:=true omnet_network:=lora omnet_ui:=cmdenv

