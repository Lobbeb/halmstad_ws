# YOLO 1-to-1 debug run matrix.
#
# Copy a run_args line directly after:
#   ./run.sh tmux_1to1 restart baylands
#
# Example:
#   ./run.sh tmux_1to1 restart baylands <run_args>
#
# If changing location, add waypoint:=<name>. Restart will run realign_yaw
# with_uav:=true before localization/nav2/follow restart.
#
# param_overrides are manual edits in:
#   src/lrs_halmstad/config/run_follow_defaults.yaml

copy_prefix: "./run.sh tmux_1to1 restart baylands"

default_run_args: "session:=yolo_debug mode:=yolo gui:=false weights:=/home/ruben/halmstad_ws/models/obb/mymodels/baylands-leader-v9-tuned-full.pt obb:=true tracker:=true external_detection_node:=tracker tracker_config:=bytetrack.yaml use_estimate:=true yolo_control_mode:=follow_uav_estimate visual_follow_logic:=legacy detector_backend:=ultralytics detector_async_inference:=true yolo_device:=auto detector_onnx_model:=/home/ruben/halmstad_ws/models/obb/mymodels/onnx/baylands-leader-v9-tuned-full.onnx start_visual_actuation_bridge:=false start_visual_follow_controller:=false start_visual_follow_point_generator:=false start_visual_follow_planner:=false follow_yaw:=true pan_enable:=true use_tilt:=true omnet:=true range_mode:=radio"
runs:
  - id: "00_all_enabled"
    goal: "Baseline with the full intended YOLO stack."
    run_args: "session:=yolo_debug mode:=yolo gui:=false weights:=/home/ruben/halmstad_ws/models/obb/mymodels/baylands-leader-v9-tuned-full.pt obb:=true tracker:=true external_detection_node:=tracker tracker_config:=bytetrack.yaml use_estimate:=true yolo_control_mode:=follow_uav_estimate visual_follow_logic:=legacy detector_backend:=ultralytics detector_async_inference:=true yolo_device:=auto detector_onnx_model:=/home/ruben/halmstad_ws/models/obb/mymodels/onnx/baylands-leader-v9-tuned-full.onnx start_visual_actuation_bridge:=false start_visual_follow_controller:=false start_visual_follow_point_generator:=false start_visual_follow_planner:=false follow_yaw:=true pan_enable:=true use_tilt:=true omnet:=true range_mode:=radio"
    param_overrides:
      camera_tracker.tick_hz: 5.0,
      leader_tracker && detector.predict_hz: 10.0,
      follow_uav.leader_heading_offset_deg: 0.0
      follow_uav.leader_motion_heading_min_speed_mps: 0.0
      follow_uav.leader_motion_heading_min_delta_m: 0.0
      follow_uav.leader_motion_heading_alpha: 0.0
      follow_uav.follow_speed_mps: 2.0
      follow_uav.follow_speed_gain: 1.5
      follow_uav.follow_yaw_rate_rad_s: 0.2
      follow_uav.follow_yaw_rate_gain: 1.5
      leader_tracker && detector.async.inference: false # Overriden to true
      leader_tracker && detector.async.latest_frame_only: false # Overriden to true
    result:
      status: "bad"
      detects: true
      follows: "kind of"
      yaw_rotations: "small"
      gazebo_stable: true
      gpu_spike: false
      notes: "Goes towards and away from the UGV, I think its the radio_distance estimate since it jumps from ~7 to ~ 20m and does not update so often.""

  - id: "01_no_tracker_detector_only"
