    param_overrides: {
      same_as_previous_run: true,
      exeptions: {
        leader_tracker && detector.async_inference: false,
        leader_tracker && detector.latest_frame_only: true,
        leader_estimator.radio_range_topic: /omnet/radio_distance
      }
    }
    result:
      status: "very good"
      detects: true
      follows: true
      yaw_rotations: "none"
      gazebo_stable: true
      gpu_spike: true
      notes: "First run OmNet++ 300s time ran outAlmost too good to be true; very stable detections (>95) and smooth motion. Stays at the distance we want and holds it."

