            weights: Overrides the ONNX if set in args no matter what,
            detector_onnx_model: Needs detector_backend:=onnix and obb:=true otherwise defaults back to .pt,
            yolo_control_mode: Controls the visual-follow stuff,
            lidar: There is no single 2d nav. We do 3d pc -> pc2ls -> 2d ls,
            scan_real_hz: only if -,
            use_scan_relay: - is set to "true",
            use_actual_heading: Almost to dangerous too keep as it could leak ugv data,
            detector_async_inference: This sets BOTH tracker and detection; if "true" sets "false" to trackers async,
