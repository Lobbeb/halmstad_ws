      notes: "4th run A B false, C true: No difference, except tiny side movements."
      notes: "5th run: A C false, B true: Finally the UAV moves forward with the UGV. But it ignores yaw and stays at the same angle. As the others did."
      notes: "6th run: A false, B C true: Follows just as well, but image less stable. Increased tick_hz 5.0 -> 15.0: Less laggy at least.


